[package]
name = "language-server-1o"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Portable 1o language server (LSP) with schema discovery and AST export"
repository = "https://github.com/jameshuntt/1oLanguageSupport"
publish = false  # release only after testing and manual approval

[dependencies]
core-1o = { version = "0.2.0", path = "../core-1o" }
anyhow = "1"
crossbeam-channel = "0.5"
lsp-server = "0.7.9"
lsp-types = "0.97.0"
percent-encoding = "2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3"
