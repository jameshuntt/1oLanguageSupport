[package]
name = "core-1o"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Reusable 1o lexer, AST, schema lookup and validation"
repository = "https://github.com/jameshuntt/1oLanguageSupport"
publish = false  # release only after Mac compilation and API review

[dependencies]
lsp-types = "0.97.0"
percent-encoding = "2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3"
